name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python experiments/run_v0.py --episodes 360 --out /tmp/nssn2_v0.json
      - name: Extract browser JavaScript
        run: python -c "import pathlib,re; text=pathlib.Path('index.html').read_text(encoding='utf-8'); match=re.search(r'<script>([\\s\\S]*?)</script>', text); assert match; pathlib.Path('/tmp/nssn2-demo.js').write_text(match.group(1), encoding='utf-8')"
      - name: Check browser JavaScript syntax
        run: node --check /tmp/nssn2-demo.js
